<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" ry="64" fill="url(#bgGradient)"/>
  
  <!-- Thomson Reuters "TR" branding in upper area - made much larger -->
  <text x="256" y="90" font-family="Arial, sans-serif" font-size="72" font-weight="bold" text-anchor="middle" fill="white" opacity="0.95">TR</text>
  
  <!-- Main container representing a terminal/script window -->
  <rect x="64" y="120" width="384" height="280" rx="12" ry="12" fill="url(#iconGradient)" filter="url(#shadow)"/>
  
  <!-- Terminal header bar -->
  <rect x="64" y="120" width="384" height="40" rx="12" ry="12" fill="#374151"/>
  <rect x="64" y="132" width="384" height="28" fill="#374151"/>
  
  <!-- Terminal control buttons -->
  <circle cx="88" cy="140" r="6" fill="#ef4444"/>
  <circle cx="112" cy="140" r="6" fill="#f59e0b"/>
  <circle cx="136" cy="140" r="6" fill="#10b981"/>
  
  <!-- Script/code lines -->
  <rect x="88" y="175" width="120" height="8" rx="4" fill="#3b82f6"/>
  <rect x="88" y="195" width="80" height="8" rx="4" fill="#6b7280"/>
  <rect x="88" y="215" width="150" height="8" rx="4" fill="#3b82f6"/>
  <rect x="88" y="235" width="100" height="8" rx="4" fill="#6b7280"/>
  
  <!-- Gear icon (management) -->
  <g transform="translate(300, 180)">
    <circle cx="36" cy="36" r="32" fill="#1f2937" opacity="0.1"/>
    <path d="M36 20c-8.8 0-16 7.2-16 16s7.2 16 16 16 16-7.2 16-16-7.2-16-16-16zm0 24c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8z" fill="#1f2937"/>
    <path d="M36 16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2s-2 .9-2 2v6c0 1.1.9 2 2 2z" fill="#1f2937"/>
    <path d="M36 72c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2s2-.9 2-2v-6c0-1.1-.9-2-2-2z" fill="#1f2937"/>
    <path d="M72 38c0-1.1-.9-2-2-2h-6c-1.1 0-2 .9-2 2s.9 2 2 2h6c1.1 0 2-.9 2-2z" fill="#1f2937"/>
    <path d="M8 38c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2s-.9-2-2-2h-6c-1.1 0-2 .9-2 2z" fill="#1f2937"/>
  </g>
  
  <!-- Play button (execution) -->
  <g transform="translate(88, 275)">
    <circle cx="24" cy="24" r="24" fill="#10b981"/>
    <path d="M18 12l12 12-12 12V12z" fill="white"/>
  </g>
  
  <!-- Document/report icon -->
  <g transform="translate(320, 275)">
    <rect x="8" y="8" width="32" height="40" rx="2" fill="white"/>
    <rect x="8" y="8" width="32" height="8" fill="#3b82f6"/>
    <rect x="12" y="20" width="24" height="2" fill="#6b7280"/>
    <rect x="12" y="26" width="20" height="2" fill="#6b7280"/>
    <rect x="12" y="32" width="24" height="2" fill="#6b7280"/>
    <rect x="12" y="38" width="16" height="2" fill="#6b7280"/>
  </g>
  
  <!-- "Script Manager" subtitle - made much larger -->
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white" opacity="0.9">Script Manager</text>
</svg>