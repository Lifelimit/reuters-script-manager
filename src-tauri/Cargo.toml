[package]
name = "reuters-script-manager"
version = "0.1.0"
description = "A Tauri App for managing and launching Reuters scripts"
authors = ["you"]
license = ""
repository = ""
default-run = "reuters-script-manager"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5.0", features = ["fs-exists", "fs-read-file", "shell-open", "dialog-open"] }
tokio = { version = "1", features = ["full"] }
dirs-next = "2.0"
regex = "1"
notify = "6"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
